<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Humanhood | Panel de control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .login-card {
            max-width: 500px;
            margin: 100px auto;
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
        .status-ok { color: #4ade80; }
        .status-warning { color: #fbbf24; }
        .status-danger { color: #f87171; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
        }
        .badge-active { background: #22c55e20; color: #4ade80; }
        .badge-warning { background: #f59e0b20; color: #fbbf24; }
        .badge-blocked { background: #ef444420; color: #f87171; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loginContainer" class="container">
        <div class="login-card">
            <svg width="60" height="60" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto 20px;">
                <circle cx="16" cy="11" r="5" stroke="url(#grad)" stroke-width="2" fill="none"/>
                <path d="M8 16 L12 13 L12 19 L8 16Z" fill="url(#grad)"/>
                <path d="M24 16 L20 13 L20 19 L24 16Z" fill="url(#grad)"/>
                <circle cx="10" cy="22" r="2" fill="url(#grad)"/>
                <circle cx="22" cy="22" r="2" fill="url(#grad)"/>
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea"/>
                        <stop offset="100%" style="stop-color:#764ba2"/>
                    </linearGradient>
                </defs>
            </svg>
            <h2>🔐 Panel de Administración</h2>
            <p style="color: #94a3b8; margin: 16px 0;">Acceso exclusivo para el equipo de Humanhood</p>
            <button id="connectAdminBtn" class="btn">🔌 Conectar con MetaMask</button>
            <div id="authStatus" style="margin-top: 16px; color: #94a3b8;"></div>
        </div>
    </div>

    <div id="adminContainer" class="container hidden">
        <div class="card">
            <h2>📋 Clientes en prueba (Polygon Amoy)</h2>
            <div id="clientsList">Cargando...</div>
            <button id="refreshBtn" style="margin-top: 16px; background: #334155; padding: 8px 16px; border-radius: 8px; border: none; color: white; cursor: pointer;">🔄 Refrescar</button>
        </div>
        <div class="card">
            <h2>💰 Ingresos (Contrato Paid)</h2>
            <div id="paidStats">Cargando...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        // CONFIGURACIÓN
        const FREE_ADDRESS = "0xD9f766cCbE8EBb138925D22cEA589B1c5faEdEf8";
        const PAID_ADDRESS = "0xC346AB25a0028efefB5AAD78d46b5590b38864b5";
        const OWNER_WALLET = "0xED022975870410189Ba6d72183A989463E563bBE".toLowerCase();
        
        const FREE_ABI = [
            "function consultasRealizadas(address) view returns (uint256)",
            "function LIMITE_FREE() view returns (uint256)"
        ];
        
        const PAID_ABI = [
            "function balanceOf(address) view returns (uint256)",
            "function PRECIO_POR_CONSULTA() view returns (uint256)"
        ];
        
        let provider, contractFree, contractPaid;
        let isAuthorized = false;
        let clients = [];
        
        function loadClients() {
            const saved = localStorage.getItem('humanhood_admin_clients');
            if (saved) clients = JSON.parse(saved);
            renderClients();
        }
        
        async function renderClients() {
            const container = document.getElementById('clientsList');
            if (!contractFree) { container.innerHTML = '<p>Conectando a blockchain...</p>'; return; }
            if (clients.length === 0) { container.innerHTML = '<p>No hay clientes añadidos.</p>'; return; }
            
            let html = `<table><thead><tr><th>Empresa</th><th>Dirección</th><th>Consultas</th><th>Estado</th></tr></thead><tbody>`;
            for (const client of clients) {
                try {
                    const realizadas = await contractFree.consultasRealizadas(client.address);
                    const limite = await contractFree.LIMITE_FREE();
                    const restantes = Number(limite) - Number(realizadas);
                    let badgeClass = 'badge-active', statusText = `${restantes} restantes`;
                    if (realizadas >= limite) { badgeClass = 'badge-blocked'; statusText = 'Bloqueado'; }
                    else if (restantes < 100) { badgeClass = 'badge-warning'; statusText = `⚠️ ${restantes} restantes`; }
                    html += `<tr><td>${client.name || '-'}</td><td style="font-family:monospace">${client.address.slice(0,8)}...</td><td>${realizadas}/${limite}</td><td><span class="badge ${badgeClass}">${statusText}</span></td></tr>`;
                } catch(e) { html += `<tr><td>${client.name || '-'}</td><td colspan="3">Error</td></tr>`; }
            }
            html += `</tbody>6<table>`;
            container.innerHTML = html;
        }
        
        async function loadPaidStats() {
            if (!contractPaid) return;
            try {
                const balance = await contractPaid.balanceOf(OWNER_WALLET);
                const precio = await contractPaid.PRECIO_POR_CONSULTA();
                const consultas = Math.floor(Number(balance) / Number(precio));
                document.getElementById('paidStats').innerHTML = `
                    <p><strong>USDC depositado:</strong> ${(Number(balance)/1e18).toFixed(2)} USDC</p>
                    <p><strong>Consultas pagadas:</strong> ${consultas.toLocaleString()}</p>
                    <p><strong>Tus ingresos:</strong> ${(Number(balance)/1e18).toFixed(2)} USDC</p>
                `;
            } catch(e) { document.getElementById('paidStats').innerHTML = '<p>Error al cargar</p>'; }
        }
        
        document.getElementById('connectAdminBtn').onclick = async () => {
            if (!window.ethereum) { document.getElementById('authStatus').innerHTML = '❌ Instala MetaMask'; return; }
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const wallet = accounts[0].toLowerCase();
                if (wallet !== OWNER_WALLET) { document.getElementById('authStatus').innerHTML = '❌ Acceso denegado. No eres el administrador.'; return; }
                
                isAuthorized = true;
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('adminContainer').classList.remove('hidden');
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                contractFree = new ethers.Contract(FREE_ADDRESS, FREE_ABI, provider);
                contractPaid = new ethers.Contract(PAID_ADDRESS, PAID_ABI, provider);
                loadClients();
                await loadPaidStats();
            } catch(e) { document.getElementById('authStatus').innerHTML = '❌ Error al conectar'; }
        };
        
        document.getElementById('refreshBtn').onclick = () => { renderClients(); loadPaidStats(); };
        
        // AÑADE TUS CLIENTES AQUÍ (descomenta y modifica)
        // clients.push({ address: "0x...", name: "Cliente ejemplo" });
        // localStorage.setItem('humanhood_admin_clients', JSON.stringify(clients));
    </script>
</body>
</html>
