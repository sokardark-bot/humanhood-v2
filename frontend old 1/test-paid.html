<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanhood | Test Contrato Paid</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 24px; padding: 32px; max-width: 550px; width: 100%; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 12px; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .balance { background: #0f172a; padding: 16px; border-radius: 16px; margin: 16px 0; text-align: center; }
        .balance .amount { font-size: 2rem; font-weight: 700; color: #4ade80; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; margin-top: 8px; }
        .status { margin-top: 16px; padding: 12px; border-radius: 12px; font-size: 0.8rem; }
        .success { background: #22c55e20; color: #4ade80; }
        .error { background: #ef444420; color: #f87171; }
        .info { background: #3b82f620; color: #60a5fa; }
        .hidden { display: none; }
        pre { font-size: 0.7rem; background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; max-height: 200px; }
        .btn-secondary { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🧪 Test Contrato Paid</h1>
        <p>Polygon Mainnet · Prueba con USDC real</p>

        <button id="connectBtn">🔌 Conectar MetaMask</button>

        <div id="infoPanel" class="hidden">
            <div class="balance">
                <div>💰 Tu USDC</div>
                <div class="amount" id="usdcBalance">--</div>
                <div style="font-size: 0.7rem;" id="walletAddr">-</div>
                <div style="font-size: 0.7rem;" id="networkInfo">-</div>
            </div>

            <div class="balance" style="background: #1e293b; border: 1px solid #334155;">
                <div>🏦 Saldo en el contrato (clientes)</div>
                <div class="amount" id="contractBalance" style="color: #60a5fa;">--</div>
            </div>

            <div class="balance" style="background: #1e293b; border: 1px solid #334155;">
                <div>💵 Tus ingresos (owner)</div>
                <div class="amount" id="ownerBalance" style="color: #fbbf24;">--</div>
            </div>

            <input type="number" id="depositAmount" placeholder="Cantidad USDC a depositar (ej: 5)">
            <button id="depositBtn">📥 Depositar USDC en el contrato</button>

            <input type="text" id="checkAddress" placeholder="Dirección a consultar" value="0xED022975870410189Ba6d72183A989463E563bBE">
            <button id="checkBtn">🔍 Consultar (cuesta 0.05 USDC)</button>

            <button id="withdrawBtn" class="btn-secondary">💸 Retirar USDC del contrato</button>

            <div id="status" class="status hidden"></div>
            
            <details>
                <summary>📋 Log de depuración</summary>
                <pre id="log"></pre>
            </details>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        // CONFIGURACIÓN
        const CONTRACT_ADDRESS = "0x2A7396876a13812fEFc5773094f217d5380FEeB9";
        const USDC_ADDRESS = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";
        
        const CONTRACT_ABI = [
            "function checkHuman(address) external returns (bool)",
            "function balanceOf(address) view returns (uint256)",
            "function depositUSDC(uint256) external",
            "function withdrawUSDC(address, uint256) external",
            "function owner() view returns (address)"
        ];
        
        const USDC_ABI = [
            "function approve(address, uint256) returns (bool)",
            "function balanceOf(address) view returns (uint256)",
            "function decimals() view returns (uint8)"
        ];
        
        let provider, signer, userAddress;
        let contract, usdc;
        
        function addLog(msg) {
            const logDiv = document.getElementById("log");
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerText += `[${timestamp}] ${msg}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        async function showStatus(msg, type) {
            const div = document.getElementById("status");
            div.innerText = msg;
            div.className = `status ${type}`;
            div.classList.remove("hidden");
            addLog(msg);
            setTimeout(() => div.classList.add("hidden"), 8000);
        }
        
        async function updateAllBalances() {
            if (!userAddress || !contract || !usdc) return;
            try {
                const decimals = await usdc.decimals();
                const userBalance = await usdc.balanceOf(userAddress);
                document.getElementById("usdcBalance").innerText = (userBalance / 10**decimals).toFixed(2);
                
                const contractBalance = await usdc.balanceOf(CONTRACT_ADDRESS);
                document.getElementById("contractBalance").innerText = (contractBalance / 10**decimals).toFixed(2);
                
                const owner = await contract.owner();
                const ownerBalance = await usdc.balanceOf(owner);
                document.getElementById("ownerBalance").innerText = (ownerBalance / 10**decimals).toFixed(2);
            } catch(e) {
                addLog(`❌ Error actualizando balances: ${e.message}`);
            }
        }
        
        // CONEXIÓN
        document.getElementById("connectBtn").onclick = async () => {
            addLog("🔌 Intentando conectar...");
            if (!window.ethereum) {
                alert("Instala MetaMask");
                return;
            }
            
            try {
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                userAddress = accounts[0];
                addLog(`✅ Cuenta: ${userAddress}`);
                document.getElementById("walletAddr").innerText = userAddress.slice(0,8)+"..."+userAddress.slice(-6);
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                
                const network = await provider.getNetwork();
                addLog(`🌐 Network: chainId=${network.chainId}`);
                document.getElementById("networkInfo").innerHTML = `Red: ${network.chainId === 137 ? '✅ Polygon Mainnet' : '⚠️ Red incorrecta (debe ser 137)'}`;
                
                if (network.chainId !== 137) {
                    showStatus("❌ Cambia a Polygon Mainnet en MetaMask", "error");
                    return;
                }
                
                usdc = new ethers.Contract(USDC_ADDRESS, USDC_ABI, signer);
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                
                await updateAllBalances();
                
                document.getElementById("connectBtn").classList.add("hidden");
                document.getElementById("infoPanel").classList.remove("hidden");
                showStatus("✅ Conectado a Polygon Mainnet", "success");
            } catch(e) {
                addLog(`❌ ERROR: ${e.message}`);
                showStatus("Error: " + e.message, "error");
            }
        };
        
        // DEPOSITAR
        document.getElementById("depositBtn").onclick = async () => {
            const amount = parseFloat(document.getElementById("depositAmount").value);
            if (isNaN(amount) || amount <= 0) {
                showStatus("Cantidad inválida", "error");
                return;
            }
            
            try {
                const decimals = await usdc.decimals();
                const amountWei = ethers.utils.parseUnits(amount.toString(), decimals);
                
                showStatus("📝 Autorizando al contrato a gastar USDC...", "info");
                const approveTx = await usdc.approve(CONTRACT_ADDRESS, amountWei);
                await approveTx.wait();
                addLog(`✅ Autorización completada`);

                showStatus("💰 Depositando USDC en el contrato...", "info");
                const depositTx = await contract.depositUSDC(amountWei);
                await depositTx.wait();
                
                showStatus(`✅ Depositado ${amount} USDC`, "success");
                await updateAllBalances();
                document.getElementById("depositAmount").value = "";
            } catch(e) {
                showStatus("Error: " + e.message, "error");
            }
        };
        
        // CHECK HUMAN
        document.getElementById("checkBtn").onclick = async () => {
            const address = document.getElementById("checkAddress").value.trim();
            if (!address) {
                showStatus("Dirección inválida", "error");
                return;
            }
            
            try {
                showStatus(`🔍 Consultando ${address.slice(0,8)}... (coste 0.05 USDC)`, "info");
                const tx = await contract.checkHuman(address);
                await tx.wait();
                
                const isHuman = await contract.checkHuman(address);
                if (isHuman) {
                    showStatus(`✅ ${address.slice(0,8)}... ES HUMANO`, "success");
                } else {
                    showStatus(`❌ ${address.slice(0,8)}... NO es humano`, "error");
                }
                await updateAllBalances();
            } catch(e) {
                showStatus("Error: " + e.message, "error");
            }
        };
        
        // RETIRAR (solo owner)
        document.getElementById("withdrawBtn").onclick = async () => {
            try {
                const decimals = await usdc.decimals();
                const contractBalance = await usdc.balanceOf(CONTRACT_ADDRESS);
                if (contractBalance === 0) {
                    showStatus("No hay fondos en el contrato para retirar", "error");
                    return;
                }
                showStatus(`💸 Retirando ${contractBalance / 10**decimals} USDC...`, "info");
                const tx = await contract.withdrawUSDC(userAddress, contractBalance);
                await tx.wait();
                showStatus("✅ Retiro completado", "success");
                await updateAllBalances();
            } catch(e) {
                showStatus("Error: " + e.message, "error");
            }
        };
        
        // Escuchar cambios de red/cuenta
        if (window.ethereum) {
            window.ethereum.on('chainChanged', () => window.location.reload());
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) window.location.reload();
                else location.reload();
            });
        }
    </script>
</body>
</html>
