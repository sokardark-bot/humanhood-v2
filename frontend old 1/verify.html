<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanhood | Verificación humana</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e293b; border-radius: 32px; padding: 48px; max-width: 550px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .logo { margin-bottom: 24px; }
        .logo svg { width: 60px; height: 60px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { color: #94a3b8; margin-bottom: 32px; font-size: 0.9rem; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 14px 24px; border-radius: 16px; color: white; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .wallet-info { background: #0f172a; padding: 16px; border-radius: 16px; margin: 20px 0; word-break: break-all; font-family: monospace; font-size: 0.8rem; display: none; }
        .status { margin-top: 20px; padding: 16px; border-radius: 16px; font-size: 0.9rem; display: none; }
        .status.success { background: #22c55e20; color: #4ade80; border-left: 3px solid #4ade80; display: block; }
        .status.error { background: #ef444420; color: #f87171; border-left: 3px solid #f87171; display: block; }
        .status.loading { background: #3b82f620; color: #60a5fa; border-left: 3px solid #60a5fa; display: block; }
        .checklist { text-align: left; margin: 24px 0; background: #0f172a; border-radius: 16px; padding: 16px; }
        .checklist-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: #94a3b8; font-size: 0.85rem; }
        .checklist-item.active { color: #fbbf24; }
        .checklist-item.done { color: #4ade80; }
        .turnstile-container { display: flex; justify-content: center; margin: 20px 0; min-height: 70px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg width="60" height="60" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="11" r="5" stroke="url(#grad)" stroke-width="2" fill="none"/>
                <path d="M8 16 L12 13 L12 19 L8 16Z" fill="url(#grad)"/>
                <path d="M24 16 L20 13 L20 19 L24 16Z" fill="url(#grad)"/>
                <circle cx="10" cy="22" r="2" fill="url(#grad)"/>
                <circle cx="22" cy="22" r="2" fill="url(#grad)"/>
                <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/></linearGradient></defs>
            </svg>
        </div>
        <h1>🧠 Verificación humana</h1>
        <p class="subtitle">Demuestra que eres humano, no un bot</p>

        <div class="checklist" id="checklist">
            <div class="checklist-item" id="checkWallet">🔌 Conectar wallet</div>
            <div class="checklist-item" id="checkTurnstile">🛡️ Superar verificación anti-bot (Cloudflare)</div>
            <div class="checklist-item" id="checkPassport">🌍 Verificar actividad humana (Gitcoin Passport)</div>
            <div class="checklist-item" id="checkBlockchain">⛓️ Registrar en la blockchain</div>
        </div>

        <div id="walletInfo" class="wallet-info"></div>
        <div id="turnstileContainer" class="turnstile-container"></div>
        
        <button id="connectBtn" class="btn">🔌 Conectar MetaMask</button>
        <button id="verifyBtn" class="btn hidden">✅ Verificarme como humano</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const CONTRACT_ADDRESS = "0x2A7396876a13812fEFc5773094f217d5380FEeB9";
        const CONTRACT_ABI = [
            "function isHumanVerified(address) view returns (bool)",
            "function verifyMe() external",
            "function verifyUser(address) external",
            "event Verified(address indexed user)"
        ];
        
        const USDC_ADDRESS = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";
        
        // ⚠️ REEMPLAZA CON TU SITE KEY DE CLOUDFLARE TURNSTILE
        const TURNSTILE_SITE_KEY = "1x00000000000000000000AA"; // ← CAMBIAR
        
        // Umbral mínimo de Gitcoin Passport para ser considerado humano
        const MIN_PASSPORT_SCORE = 15;
        
        // Gitcoin Passport API (testnet)
        const PASSPORT_API = "https://api.scorer.gitcoin.co/checkout";
        const SCORER_ID = 1; // Community scorer
        
        let provider, signer, contract, usdcContract;
        let userAddress = null;
        let turnstileToken = null;
        let passportScore = 0;
        
        // Elementos DOM
        const connectBtn = document.getElementById("connectBtn");
        const verifyBtn = document.getElementById("verifyBtn");
        const walletInfoDiv = document.getElementById("walletInfo");
        const turnstileContainer = document.getElementById("turnstileContainer");
        const statusDiv = document.getElementById("status");
        const checklistItems = {
            wallet: document.getElementById("checkWallet"),
            turnstile: document.getElementById("checkTurnstile"),
            passport: document.getElementById("checkPassport"),
            blockchain: document.getElementById("checkBlockchain")
        };
        
        function updateChecklist(item, status) {
            if (status === 'active') {
                checklistItems[item].classList.add('active');
                checklistItems[item].classList.remove('done');
            } else if (status === 'done') {
                checklistItems[item].classList.remove('active');
                checklistItems[item].classList.add('done');
            }
        }
        
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        // ==================== PASO 1: CONECTAR WALLET ====================
        connectBtn.onclick = async () => {
            if (!window.ethereum) {
                alert("Instala MetaMask primero");
                window.open("https://metamask.io/download/", "_blank");
                return;
            }
            try {
                updateChecklist('wallet', 'active');
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                walletInfoDiv.innerHTML = `📍 Conectado: ${userAddress.slice(0,8)}...${userAddress.slice(-6)}`;
                walletInfoDiv.style.display = "block";
                connectBtn.style.display = "none";
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                
                // Verificar si ya está verificado
                const isHuman = await contract.isHumanVerified(userAddress);
                if (isHuman) {
                    updateChecklist('wallet', 'done');
                    updateChecklist('turnstile', 'done');
                    updateChecklist('passport', 'done');
                    updateChecklist('blockchain', 'done');
                    showStatus("✅ Ya estás verificado como humano en la blockchain", "success");
                    return;
                }
                
                updateChecklist('wallet', 'done');
                
                // Iniciar Turnstile
                startTurnstile();
                
            } catch(e) {
                console.error(e);
                showStatus("Error al conectar la wallet", "error");
            }
        };
        
        // ==================== PASO 2: CLOUDFLARE TURNSTILE ====================
        function startTurnstile() {
            updateChecklist('turnstile', 'active');
            turnstileContainer.classList.remove('hidden');
            
            turnstile.ready(function() {
                turnstile.render('#turnstileContainer', {
                    sitekey: TURNSTILE_SITE_KEY,
                    callback: function(token) {
                        turnstileToken = token;
                        updateChecklist('turnstile', 'done');
                        verifyTurnstile(token);
                    }
                });
            });
        }
        
        async function verifyTurnstile(token) {
            // Aquí normalmente enviarías el token a tu backend para verificar
            // Como no tenemos backend, simulamos que es válido si hay token
            // En producción, siempre verifica del lado del servidor
            
            showStatus("🛡️ Anti-bot verificado. Verificando actividad humana...", "loading");
            
            // Pequeño delay para simular la verificación (en producción no lo necesitas)
            setTimeout(() => {
                checkGitcoinPassport();
            }, 500);
        }
        
        // ==================== PASO 3: GITCOIN PASSPORT ====================
        async function checkGitcoinPassport() {
            updateChecklist('passport', 'active');
            showStatus("🌍 Verificando actividad humana en Gitcoin Passport...", "loading");
            
            try {
                // 1. Obtener el score del usuario
                const scoreResponse = await fetch(`${PASSPORT_API}/score/${SCORER_ID}/${userAddress}`);
                const scoreData = await scoreResponse.json();
                passportScore = scoreData.score || 0;
                
                if (passportScore >= MIN_PASSPORT_SCORE) {
                    updateChecklist('passport', 'done');
                    showStatus(`✅ Actividad humana verificada (Score: ${passportScore})`, "success");
                    // Mostrar botón de verificación final
                    verifyBtn.classList.remove("hidden");
                } else {
                    updateChecklist('passport', 'done'); // Lo marcamos como completado aunque haya fallado
                    showStatus(`❌ No se ha verificado actividad humana suficiente (Score: ${passportScore} mínimo: ${MIN_PASSPORT_SCORE})`, "error");
                    showStatus("Por favor, completa tu Gitcoin Passport en https://passport.gitcoin.co/", "error");
                }
            } catch(e) {
                console.error("Error consultando Gitcoin Passport:", e);
                showStatus("⚠️ Error al verificar Gitcoin Passport. Intenta de nuevo.", "error");
            }
        }
        
        // ==================== PASO 4: REGISTRO EN BLOCKCHAIN ====================
        verifyBtn.onclick = async () => {
            if (!contract || !userAddress) return;
            
            try {
                updateChecklist('blockchain', 'active');
                verifyBtn.disabled = true;
                verifyBtn.textContent = "⏳ Verificando...";
                showStatus("⛓️ Registrando verificación en la blockchain...", "loading");
                
                // Llamar a verifyMe (el usuario paga el gas)
                const tx = await contract.verifyMe();
                await tx.wait();
                
                updateChecklist('blockchain', 'done');
                showStatus("✅ ¡Verificación exitosa! Ya eres humano en la blockchain.", "success");
                verifyBtn.textContent = "✅ Ya verificado";
                verifyBtn.disabled = true;
                
                // Opcional: mostrar enlace al explorador
                const txHash = tx.hash;
                const explorerUrl = `https://polygonscan.com/tx/${txHash}`;
                showStatus(`📝 Transacción: <a href="${explorerUrl}" target="_blank" style="color:#4ade80;">Ver en Polygonscan</a>`, "success");
                
            } catch(e) {
                console.error(e);
                showStatus("Error al registrar en la blockchain: " + (e.message || "Intenta de nuevo"), "error");
                verifyBtn.disabled = false;
                verifyBtn.textContent = "✅ Verificarme como humano";
                updateChecklist('blockchain', 'active');
            }
        };
    </script>
</body>
</html>
